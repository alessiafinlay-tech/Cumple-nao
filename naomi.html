<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumple 18 ❤︎</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MiFuente:wght@600;700&family=MiFuente:wght@400;600&display=swap">
<style>
    @font-face{
  font-family:'MiFuente';
  src:url('fuente.ttf') format('truetype');
  font-display:swap;
}
    .album{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px} 
    #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(170deg,#130d0d,#2f161a);transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
:root{
  color-scheme: dark;
  --bg1:#130d0d; --bg2:#2f161a; --bg3:#612a34;
  --ink:#f3efff; --soft:#e0567b; --card:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.22); --gold:#ffe9a8; --red:#cf989a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'MiFuente',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;
  min-height:100vh; overflow-x:hidden; text-align:center;
}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:36px 20px 60px}
.moon{font-size:64px;display:block;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
h1{font-family:'MiFuente',cursive;font-size:clamp(46px,14vw,78px);line-height:1;margin:10px 0 6px;color:var(--gold);text-shadow:0 0 24px rgba(255,233,168,.45)}
.sub{color:var(--soft);font-size:18px;margin:0 0 28px}
.age{font-family:'MiFuente',cursive;font-size:150px;line-height:.9;margin:0;
  background:linear-gradient(180deg,#fff,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;margin:26px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
h2{font-family:'MiFuente',cursive;font-size:34px;margin:0 0 12px;color:var(--gold)}
button{font:inherit;font-weight:600;color:#2f161a;background:linear-gradient(135deg,var(--gold),var(--red));border:0;border-radius:999px;padding:14px 28px;font-size:18px;cursor:pointer;box-shadow:0 8px 24px rgba(255,184,230,.35)}
button:active{transform:scale(.96)}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
#letter{display:none;text-align:left;line-height:1.7;font-size:17px;white-space:pre-line;animation:pop .6s ease}
#letter.show{display:block}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
ul{list-style:none;padding:0;margin:0;text-align:left}
li{padding:12px 4px;border-bottom:1px dashed var(--line);display:flex;gap:12px;align-items:center}
li:last-child{border:0}
li span{font-size:22px}
li a{color:var(--ink);text-decoration:none}
li small{display:block;color:var(--soft)}
.dog{font-size:44px}
footer{color:var(--soft);font-family:'MiFuente',cursive;font-size:26px;margin-top:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fl{position:fixed;z-index:0;pointer-events:none;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(calc(var(--r,0deg) + 4deg))}}
.pol{background:#fff;padding:10px 10px 32px;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));width:170px}
@media (min-width:700px){ .pol{width:170px} }
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.star{position:fixed;z-index:0;pointer-events:none;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.7) rotate(20deg)}} 
.sn{width:130px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.fl{position:fixed;z-index:0;pointer-events:none;animation:fl 6s ease-in-out infinite}
</style>
</head>
<body>
    <div id="intro">
  <h1>¡Hola Noaomii!</h1>
  <p class="sub">Haz click abajo</p>
  <button id="enter">★</button>
</div>
<canvas id="stars" aria-hidden="true"></canvas>
<button id="play" style="position:fixed;bottom:18px;right:18px;z-index:9">🎵 Música</button>
<script>
    for (let i = 0; i < 30; i++) {
  const s = document.createElement("span");
  s.className = "star";
  s.textContent = ["⭐","★","☆"][i % 3];
  s.style.top = Math.random() * 95 + "%";
  s.style.left = Math.random() * 95 + "%";
  s.style.fontSize = 12 + Math.random() * 18 + "px";
  s.style.animationDelay = Math.random() * 3 + "s";
  document.body.appendChild(s);
} 
const lista = ["cancion1.mp3", "cancion2.mp3", "cancion3.mp3"];
let n = 0;
const cancion = new Audio(lista[0]);
cancion.onended = () => {
  n = (n + 1) % lista.length;
  cancion.src = lista[n];
  cancion.play();
};
cancion.onerror = () => alert("No encuentro el archivo cancion.mp3");
document.getElementById("enter").onclick = () => {
  cancion.play().catch(e => alert("Error: " + e.message));
  document.getElementById("intro").classList.add("hide");
};
</script>
<main>
  <span class="moon" aria-hidden="true">❤︎</span>
  <h1 id="title"></h1>
  <p class="sub">"you seem pretty calm for a birthday girl" ✨</p>
  <p class="age">18</p>

  <section class="card">
    <h2>Tengo algo para ti</h2>
    <button id="open">Abrir carta ☚</button>
    <div id="letter"></div>
  </section>

  <section class="card">
    <h2>Playlist 🎧</h2>
    <iframe src="https://open.spotify.com/embed/playlist/1A0EZdcuDmjrz6aJBtBC1w" width="100%" height="352" frameborder="0" allow="encrypted-media" style="border-radius:16px"></iframe>
  </section>

  <section class="card">
  <h2>Photograph 📸</h2>
  <div class="album">
    <img src="foto1.jpg"><img src="foto2.jpg">
    <img src="foto3.jpg"><img src="foto4.jpg">
  </div>
</section> 

  <section class="card">
    <span class="dog" aria-hidden="true">➊➑</span>
    <h2>Un deseo</h2>
    <p style="margin:0 0 16px;color:var(--soft)">Do you remember the 28th night of NOVEMBER*?.</p>
    <button id="wish">Pedir deseo ☺</button>
  </section>

  <footer>con cariño, <span id="from"></span> ❤︎</footer>
  <div class="fl pol" style="top:6%;left:3%;--r:-8deg"><img src="nomi-5.jpg"></div>
<div class="fl pol" style="top:22%;right:3%;--r:7deg;animation-delay:1s"><img src="nomi-1.jpg"></div>
<div class="fl pol" style="top:48%;left:2%;--r:5deg;animation-delay:2s"><img src="nomi-2.jpg"></div>
<div class="fl pol" style="top:66%;right:2%;--r:-6deg;animation-delay:.5s"><img src="nomi-3.jpg"></div>
<div class="fl pol" style="top:84%;left:6%;--r:9deg;animation-delay:1.5s"><img src="nomi-4.jpg"></div> 

<img class="fl sn" src="snoopy1.png" style="top:14%;left:21%">
<img class="fl sn" src="snoopy2.png" style="top:35%;right:21%;animation-delay:1s">
<img class="fl sn" src="snoopy1.png" style="top:70%;left:19%;animation-delay:2s">
<img class="fl sn" src="snoopy2.png" style="top:75%;right:15%;animation-delay:.5s">
</main>

<script>
/* ====== EDITA SOLO ESTA PARTE ====== */
const NAME = "Nao!!";           // nombre de tu amiga
const FROM = "de la nub y la pro";        // tu nombre
const LETTER = `¡Feliz cumple, ${NAME}.

28 de Noviembre llego realmente rápido, probablemente hoy estés sobrepensando qué hacer con tu vida (como todos los días) y aunque la preocupación es parte de crecer, conozco bien que a veces por ello no te permites realmente disfrutar de las cosas que te suceden al momento. Tal vez es hoy un día en el que debes permitírtelo.
18 es una edad muy satanizada, tal vez podemos hablar del privilegio pero... ¿Por qué solucionarlo todo ahora? 
Y no podemos tener días perfectos todos los días, algunos pueden ser demasiado abrumadores y sé que a veces te da ganas de dejar ir todo, hoy no tiene por qué ser uno de esos días. Tal vez ningún 28 tenga necesariamente que serlo... 
Y aunque ya no podemos vernos diario como soliamos hacerlo siempre tendrás una parte nuestra contigo ya sea en un mal chiste o una vergonzosa anécdota, justo como nosotras tendremos una tuya.
Feliz cumpleaños :)! 
`;


document.getElementById('title').textContent = "Feliz cumple, " + NAME;
document.getElementById('from').textContent = FROM;
document.getElementById('letter').textContent = LETTER;


document.getElementById('open').onclick = e=>{
  document.getElementById('letter').classList.add('show');
  e.target.style.display='none'; confetti();
};
document.getElementById('wish').onclick = confetti;

/* estrellas */
const c = document.getElementById('stars'), x = c.getContext('2d');
let W,H,S=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight;
  S=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6}));}
addEventListener('resize',size);size();
(function tw(t){x.clearRect(0,0,W,H);
  S.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();});
  requestAnimationFrame(tw);})(0);

/* confeti */
function confetti(){
  const sym=['♫','⭐','❤︎','★','♬','⁂'];
  for(let i=0;i<34;i++){
    const d=document.createElement('div');
    d.textContent=sym[i%sym.length];
    d.style.cssText=`position:fixed;top:-30px;left:${Math.random()*100}vw;font-size:${18+Math.random()*18}px;z-index:9;pointer-events:none;transition:transform ${2.5+Math.random()*2}s ease-in,opacity 4s`;
    document.body.appendChild(d);
    requestAnimationFrame(()=>{d.style.transform=`translate(${(Math.random()-.5)*160}px,${innerHeight+80}px) rotate(${Math.random()*540}deg)`;d.style.opacity=0;});
    setTimeout(()=>d.remove(),5000);
  }
}
</script>
</body>
</html>
